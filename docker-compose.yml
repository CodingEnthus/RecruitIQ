version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.7.3
    container_name: recruitiq_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  db:
    image: postgres:15-alpine
    container_name: recruitiq_postgres
    environment:
      POSTGRES_USER: recruitiq
      POSTGRES_PASSWORD: recruitiq_secret_password
      POSTGRES_DB: recruitiq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recruitiq_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://recruitiq:recruitiq_secret_password@db:5432/recruitiq_db
      - QDRANT_URL=http://qdrant:6333
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=llama-3.3-70b-versatile
    depends_on:
      - db
      - qdrant
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recruitiq_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: always

volumes:
  qdrant_data:
  postgres_data:
